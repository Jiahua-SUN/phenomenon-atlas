[project]
name = "phenomenon-atlas-review"
version = "2.0.0"
description = "Local reviewer edition of Phenomenon Atlas"
requires-python = ">=3.13,<3.14"
dependencies = [
  "starlette==1.6.0", "uvicorn==0.52.3", "numpy==2.3.2",
  "pandas==2.3.2", "pyarrow==24.0.0", "sentence-transformers==5.6.0",
  "transformers==4.57.6", "torch==2.11.0", "openai==1.109.1", "httpx==0.28.1",
  "huggingface-hub==0.36.2", "sentencepiece>=0.2,<0.3"
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
